spring:
  application:
    name: StarMachine
  datasource:
    url: jdbc:postgresql://localhost:5432/starmachine
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  statemachine:
    data:
      jpa:
        repositories:
          enabled: true
server:
  port: 8080
logging:
  level:
    org.springframework.statemachine: INFO